<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Kedai Kopi Nusantara</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark site-nav" aria-label="Navigasi utama">
      <div class="container">
        <a class="navbar-brand" href="index.html">Kedai Kopi Nusantara</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Buka navigasi">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto gap-lg-3">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About Us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="menu.html">Menu</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="gallery.html">Gallery</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <hr class="border border-light border-3 opacity-100 w-25 mt-4">
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Suasana kedai</p>
        <h1>Potongan kecil dari hari kami.</h1>
        <p class="lead col-lg-7">Ruang, rasa, dan momen yang kami siapkan setiap hari.</p>
      </div>
    </section>

    <section class="section-space">
      <div class="container">
        <h2 class="visually-hidden">Galeri suasana kedai</h2>
        <div id="galleryCarousel" class="carousel slide gallery-carousel" data-bs-ride="carousel">
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="3" aria-label="Slide 4"></button>
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="4" aria-label="Slide 5"></button>
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="5" aria-label="Slide 6"></button>
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="6" aria-label="Slide 7"></button>
            <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="7" aria-label="Slide 8"></button>
          </div>

          <div class="carousel-inner">
            <div class="carousel-item active">
              <img class="d-block w-100 gallery-slide-image" src="asset/gallery0.png" alt="Suasana ruang kedai">
            </div>
            <div class="carousel-item">
              <img class="d-block w-100 gallery-slide-image" src="asset/gallery1.png" alt="Penyajian kopi di bar">
            </div>
            <div class="carousel-item">
              <img class="d-block w-100 gallery-slide-image" src="asset/gallery2.png" alt="Kopi dan camilan di meja">
            </div>
            <div class="carousel-item">
              <img class="d-block w-100 gallery-slide-image" src="asset/gallery3.png" alt="Interior hangat kedai">
            </div>
            <div class="carousel-item">
              <img class="d-block w-100 gallery-slide-image" src="asset/gallery4.png" alt="Detail suasana kedai">
            </div>
            <div class="carousel-item">
              <img class="d-block w-100 gallery-slide-image" src="asset/gallery5.png" alt="Proses penyeduhan kopi">
            </div>
            <div class="carousel-item">
              <img class="d-block w-100 gallery-slide-image" src="asset/gallery6.png" alt="Meja dan kursi kedai">
            </div>
            <div class="carousel-item">
              <img class="d-block w-100 gallery-slide-image" src="asset/gallery7.png" alt="Suasana malam di kedai">
            </div>
          </div>

          <button class="carousel-control-prev" type="button" data-bs-target="#galleryCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#galleryCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container d-md-flex justify-content-between">
      <p class="mb-2 mb-md-0">&copy; 2026 Kedai Kopi Nusantara</p>
      <p class="mb-0">Buka setiap hari, 08.00-22.00</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    bootstrap.Carousel.getOrCreateInstance(document.getElementById('galleryCarousel'), { interval: 3000 });
  </script>
</body>
</html>
